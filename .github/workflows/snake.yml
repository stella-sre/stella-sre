name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=#7B42BC&color_dots=#ebedf0,#d8c8f0,#b392e6,#8a5cd6,#7B42BC
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#E6522C&color_dots=#161b22,#2d1b4e,#4c2a85,#7B42BC,#a371f7

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
